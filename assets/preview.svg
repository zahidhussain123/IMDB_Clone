<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">IMDb Clone Preview</title>
  <desc id="desc">A dark cinematic movie homepage inspired by IMDb.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#05070b"/>
      <stop offset="100%" stop-color="#0b1119"/>
    </linearGradient>
    <linearGradient id="heroGlow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dfe7ee" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#8d9398" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020305" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.65">
    <rect x="0" y="0" width="1600" height="80" fill="#05070b"/>
    <rect x="0" y="80" width="1600" height="680" fill="url(#heroGlow)"/>
  </g>

  <g opacity="0.2" stroke="#d9e0e6" stroke-width="2">
    <path d="M0 160 L1600 160"/>
    <path d="M0 260 L1600 260"/>
    <path d="M0 360 L1600 360"/>
  </g>

  <g fill="#f2f5f7" font-family="Arial, Helvetica, sans-serif">
    <text x="58" y="52" font-size="28" font-weight="700">IMDb</text>
    <g font-size="20" font-weight="600">
      <text x="220" y="52" fill="#FFFFFF">Movie</text>
      <text x="375" y="52" fill="#b7bec5">Popular</text>
      <text x="545" y="52" fill="#b7bec5">Top rated</text>
      <text x="715" y="52" fill="#b7bec5">Upcoming</text>
    </g>
  </g>

  <g opacity="0.85">
    <path d="M1100 120 C1210 60, 1325 95, 1400 165 L1470 250 L1600 250 L1600 0 L0 0 L0 260 L420 260 L490 160 C560 80, 660 50, 740 125 C820 200, 880 210, 980 175 C1015 160, 1060 145, 1100 120 Z" fill="#111821" opacity="0.72"/>
  </g>

  <g opacity="0.7" filter="url(#blur)">
    <ellipse cx="930" cy="430" rx="480" ry="260" fill="#c5d0d8"/>
  </g>

  <g opacity="0.7">
    <path d="M430 150 L680 310 L620 700 L330 710 Z" fill="#111821"/>
    <path d="M670 151 L920 371 L870 705 L630 708 Z" fill="#0f161d"/>
    <path d="M930 160 L1180 300 L1180 700 L890 708 Z" fill="#111821"/>
    <path d="M1165 170 L1420 280 L1460 700 L1185 710 Z" fill="#0f1318"/>
  </g>

  <g fill="#e6ecf1" font-family="Arial, Helvetica, sans-serif">
    <text x="54" y="260" font-size="92" font-weight="700">The Odyssey</text>
    <g font-size="34" font-weight="500">
      <text x="55" y="325" fill="#d3d8dd">2026-07-15</text>
      <text x="315" y="325" fill="#d3d8dd">8.019</text>
    </g>
    <text x="56" y="390" font-size="24" fill="#e4e7ea" opacity="0.9">Odysseus, the legendary king of Ithaca, embarks on a long and perilous journey home.</text>
    <text x="56" y="424" font-size="24" fill="#e4e7ea" opacity="0.9">Throughout his voyage, he is forced to confront the whims of gods, mythical monsters,</text>
    <text x="56" y="458" font-size="24" fill="#e4e7ea" opacity="0.9">and trials that stretch both his cunning and his humanity to the breaking point.</text>
  </g>

  <g fill="#ffffff" opacity="0.9">
    <circle cx="760" cy="585" r="10" fill="#a8b0b7"/>
    <circle cx="790" cy="585" r="10" fill="#a8b0b7"/>
    <circle cx="820" cy="585" r="10" fill="#a8b0b7"/>
    <circle cx="850" cy="585" r="10" fill="#a8b0b7"/>
    <circle cx="880" cy="585" r="10" fill="#a8b0b7"/>
    <circle cx="910" cy="585" r="10" fill="#a8b0b7"/>
    <circle cx="940" cy="585" r="10" fill="#a8b0b7"/>
    <circle cx="970" cy="585" r="10" fill="#a8b0b7"/>
    <circle cx="1000" cy="585" r="10" fill="#a8b0b7"/>
    <circle cx="1030" cy="585" r="10" fill="#a8b0b7"/>
    <circle cx="1060" cy="585" r="10" fill="#a8b0b7"/>
    <circle cx="1090" cy="585" r="10" fill="#a8b0b7"/>
  </g>

  <g>
    <text x="56" y="695" font-size="54" font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#f2f5f7">POPULAR</text>
  </g>

  <g transform="translate(55 730)">
    <rect x="0" y="0" width="220" height="150" rx="18" fill="#2d3c49"/>
    <rect x="245" y="0" width="220" height="150" rx="18" fill="#384d5e"/>
    <rect x="490" y="0" width="220" height="150" rx="18" fill="#3b4a52"/>
    <rect x="735" y="0" width="220" height="150" rx="18" fill="#3a3d46"/>
    <rect x="980" y="0" width="220" height="150" rx="18" fill="#354d4f"/>
    <rect x="1225" y="0" width="220" height="150" rx="18" fill="#45362d"/>
  </g>

  <g>
    <circle cx="92" cy="855" r="28" fill="#ff0000" opacity="0.8"/>
    <circle cx="330" cy="855" r="28" fill="#ffcc00" opacity="0.8"/>
    <circle cx="574" cy="855" r="28" fill="#c7d5dd" opacity="0.8"/>
    <circle cx="820" cy="855" r="28" fill="#ff4d4d" opacity="0.8"/>
    <circle cx="1067" cy="855" r="28" fill="#66b3ff" opacity="0.8"/>
    <circle cx="1310" cy="855" r="28" fill="#dca15e" opacity="0.8"/>
  </g>
</svg>
